<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>stackpulse — AI & Kodlama Takip Panosu</title>
<style>
  :root{
    --bg: #0f1115;
    --panel: #171a21;
    --panel-hi: #1d212a;
    --border: #262b35;
    --text: #e8e6e1;
    --muted: #888e99;
    --amber: #f2a93b;
    --teal: #3ddc97;
    --violet: #a78bfa;
    --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:720px;
    margin:0 auto;
    padding:22px 18px 40px;
  }
  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .brand{
    font-family:var(--mono);
    font-size:15px;
    letter-spacing:.02em;
    color:var(--text);
  }
  .brand .cursor{
    display:inline-block;
    width:8px; height:15px;
    background:var(--amber);
    margin-left:2px;
    animation:blink 1.1s steps(1) infinite;
    vertical-align:-2px;
  }
  @keyframes blink{50%{opacity:0;}}
  .updated{
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
  }
  .tabs{
    display:flex;
    gap:2px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px 10px 0 0;
    padding:6px 6px 0;
    overflow:hidden;
  }
  .tab{
    flex:1;
    text-align:center;
    font-family:var(--mono);
    font-size:12.5px;
    padding:10px 6px;
    border-radius:8px 8px 0 0;
    color:var(--muted);
    cursor:pointer;
    border:1px solid transparent;
    border-bottom:none;
    background:transparent;
    user-select:none;
    transition:color .15s ease, background .15s ease;
  }
  .tab .dot{
    display:inline-block;
    width:6px;height:6px;
    border-radius:50%;
    margin-right:6px;
    vertical-align:1px;
  }
  .tab[data-cat="ai"] .dot{background:var(--amber);}
  .tab[data-cat="kod"] .dot{background:var(--teal);}
  .tab[data-cat="arac"] .dot{background:var(--violet);}
  .tab.active{
    color:var(--text);
    background:var(--bg);
    border-color:var(--border);
  }
  .panel{
    background:var(--bg);
    border:1px solid var(--border);
    border-top:none;
    border-radius:0 0 10px 10px;
    padding:4px 4px 8px;
  }
  .feed{display:none;}
  .feed.active{display:block;}
  .item{
    display:flex;
    gap:12px;
    padding:14px 12px;
    border-bottom:1px solid var(--border);
  }
  .item:last-child{border-bottom:none;}
  .item:hover{background:var(--panel-hi);}
  .bar{
    width:3px;
    border-radius:3px;
    flex-shrink:0;
  }
  .feed[data-cat="ai"] .bar{background:var(--amber);}
  .feed[data-cat="kod"] .bar{background:var(--teal);}
  .feed[data-cat="arac"] .bar{background:var(--violet);}
  .item-body{flex:1; min-width:0;}
  .item-meta{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--muted);
    margin-bottom:4px;
    display:flex;
    gap:8px;
  }
  .item-title{
    font-size:14.5px;
    font-weight:600;
    line-height:1.35;
    margin:0 0 4px;
    color:var(--text);
  }
  .item-desc{
    font-size:13px;
    line-height:1.5;
    color:#c7c9ce;
    margin:0 0 6px;
  }
  .item a{
    font-family:var(--mono);
    font-size:11px;
    color:var(--muted);
    text-decoration:none;
    border-bottom:1px dotted var(--border);
  }
  .item a:hover{color:var(--text); border-color:var(--muted);}
  footer{
    margin-top:16px;
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--muted);
    text-align:center;
  }
  @media (max-width:420px){
    .tab{font-size:11px; padding:9px 3px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">stackpulse<span class="cursor"></span></div>
    <div class="updated" id="updated-label">güncelleme: —</div>
  </div>

  <div class="tabs">
    <div class="tab active" data-cat="ai"><span class="dot"></span>AI</div>
    <div class="tab" data-cat="kod"><span class="dot"></span>Kodlama</div>
    <div class="tab" data-cat="arac"><span class="dot"></span>Araçlar</div>
  </div>

  <div class="panel">
    <div class="feed active" data-cat="ai"></div>
    <div class="feed" data-cat="kod"></div>
    <div class="feed" data-cat="arac"></div>
  </div>

  <footer id="footer-note">içerik otomatik olarak periyodik güncellenir</footer>
</div>

<script>
  const tabs = document.querySelectorAll('.tab');
  const feeds = document.querySelectorAll('.feed');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const cat = tab.dataset.cat;
      tabs.forEach(t => t.classList.toggle('active', t === tab));
      feeds.forEach(f => f.classList.toggle('active', f.dataset.cat === cat));
    });
  });

  function esc(str){
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function renderItems(cat, items){
    const container = document.querySelector(`.feed[data-cat="${cat}"]`);
    if (!items || !items.length){
      container.innerHTML = '<div class="item"><div class="item-body"><p class="item-desc">Bu kategoride şu an gösterilecek haber yok.</p></div></div>';
      return;
    }
    container.innerHTML = items.map(it => `
      <div class="item"><div class="bar"></div><div class="item-body">
        <div class="item-meta"><span>${esc(it.date)}</span><span>·</span><span>${esc(it.source)}</span></div>
        <p class="item-title">${esc(it.title)}</p>
        <p class="item-desc">${esc(it.desc)}</p>
        <a href="${esc(it.url)}" target="_blank" rel="noopener">kaynak →</a>
      </div></div>
    `).join('');
  }

  async function loadNews(){
    try{
      const res = await fetch(`./data/news.json?_=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error('news.json alınamadı');
      const data = await res.json();

      renderItems('ai', data.categories?.ai);
      renderItems('kod', data.categories?.kod);
      renderItems('arac', data.categories?.arac);

      const label = document.getElementById('updated-label');
      if (label) label.textContent = `güncelleme: ${data.generated_at_tr || '—'}`;
    } catch (err){
      const label = document.getElementById('updated-label');
      if (label) label.textContent = 'güncelleme: alınamadı';
      const footer = document.getElementById('footer-note');
      if (footer) footer.textContent = 'haberler yüklenemedi · bağlantınızı kontrol edin';
      console.error(err);
    }
  }

  loadNews();
</script>
</body>
</html>
